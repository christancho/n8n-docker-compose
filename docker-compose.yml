x-shared: &shared
  restart: always
  image: docker.n8n.io/n8nio/n8n
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=n8n_postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    # Redis configuration
    - QUEUE_BULL_REDIS_HOST=n8n_redis
    - QUEUE_BULL_REDIS_PORT=6379
    - QUEUE_BULL_REDIS_DB=0
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    
    - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - GENERIC_TIMEZONE=${TIMEZONE}
    - TZ=${TIMEZONE}
    #Synology NAS configuration
    - PUID=${PUID}
    - PGID=${PGID}
    
    - N8N_SECURE_COOKIE=false
    - WEBHOOK_URL=${WEBHOOK_URL}
    - N8N_HOST=${N8N_HOST}
    - N8N_PORT=${N8N_PORT}
    - N8N_PROTOCOL=${N8N_PROTOCOL}
    # Worker configuration (only needed for n8n paid versions)
    # Uncomment the following lines if you have n8n paid license and want to use workers
    # - N8N_RUNNERS_ENABLED=true
    # - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    # - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    - N8N_LOG_LEVEL=info
    - N8N_LOG_OUTPUT=console
    - N8N_TRUST_PROXY=true
    # Performance optimizations for Synology NAS
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    - N8N_EXECUTION_DATA_PRUNE_MAX_COUNT=10000
    - N8N_EXECUTION_DATA_MAX_AGE=168
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    - N8N_TEMPLATES_ENABLED=false
    - N8N_ONBOARDING_FLOW_DISABLED=true
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_METRICS=true
    - N8N_METRICS_PREFIX=n8n_
    # Security configuration
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
  
  volumes:
    - ${N8N_DIR}/n8n:/home/node/.n8n
    - ${N8N_DIR}/n8n/files:/files
  depends_on:
    n8n_redis:
      condition: service_healthy
    n8n_postgres:
      condition: service_healthy
  networks:
    - n8n_net
  deploy:
    resources:
      limits:
        memory: 1.5G
      reservations:
        memory: 768M

services:
  n8n_postgres:
    container_name: n8n_postgres
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
      # Optimize for Synology NAS
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${N8N_DIR}/postgres/data:/var/lib/postgresql/data
      - ${N8N_DIR}/postgres/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=100
      -c shared_buffers=1.5GB
      -c effective_cache_size=4GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_min_messages=warning
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1.5G
    networks:
      - n8n_net

  n8n_redis:
    container_name: n8n_redis
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 60
      --timeout 300
      --tcp-backlog 511
      --databases 16
      --maxmemory-samples 10
      --port 6379
    sysctls:
      - net.core.somaxconn=1024
    volumes:
      - ${N8N_DIR}/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - n8n_net

  n8n:
    container_name: n8n_main
    <<: *shared
    ports:
      - 5678:5678
    healthcheck:
       test: ['CMD-SHELL', 'curl -f http://localhost:5678/ || exit 1']
       interval: 60s
       timeout: 30s
       retries: 5
       start_period: 600s

  # n8n-worker: Only available in n8n paid versions
  # Uncomment the following section if you have n8n paid license
  # n8n-worker:
  #   container_name: n8n_worker
  #   <<: *shared
  #   command: worker
  #   depends_on:
  #     n8n:
  #       condition: service_started
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 768M
  #       reservations:
  #         memory: 384M

networks:
  n8n_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16